name: Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-installer:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag || github.ref_name }}"
          $version = (node -p "require('./package.json').version").Trim()
          if ($tag -ne "v$version") {
            throw "Release tag $tag does not match package.json version v$version"
          }

      - name: Install locked dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Run regression suite
        run: npm test

      - name: Package Windows x64 installer
        run: npm run dist

      - name: Verify installer artifact
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path release -Filter "*.exe" -File
          if (-not $installer) { throw "No Windows installer was produced in release/" }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Magic Render Pro ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: release/*.exe
